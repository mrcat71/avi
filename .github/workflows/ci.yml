name: ci

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 # renovate will pin this to a SHA on first run
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Swift toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        # XCTest buffers its output when piped, so a hung test left no trace
        # in the log; unbuffered, the last "started" line names it.
        env:
          NSUnbufferedIO: "YES"
        run: swift test

  lint:
    name: lint
    # SwiftFormat needs no Apple SDK, so the official Linux image runs it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: SwiftFormat lint
        uses: docker://ghcr.io/nicklockwood/swiftformat:0.64.7@sha256:f97a0b775ce99b893277eb95f37d31e85710b00d8c41d11b603848f9df4a71a4
        with:
          args: --lint .

  bundle-smoke:
    name: bundle smoke
    runs-on: macos-26
    timeout-minutes: 30
    needs: build-test
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 # renovate will pin this to a SHA on first run
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Release build
        run: bash scripts/build-release.sh
      - name: Version
        run: '"$(bash scripts/build-release.sh --show-bin-path)/AviApp" --version'
      - name: Self-test
        run: '"$(bash scripts/build-release.sh --show-bin-path)/AviApp" --self-test'
      - name: avi command
        run: '"$(bash scripts/build-release.sh --show-bin-path)/AviApp" --cli version'
      - name: Package app
        run: scripts/package-app.sh 0.0.0-ci
      - name: Verify packaged app
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Avi.app
          dist/Avi.app/Contents/MacOS/Avi --self-test
