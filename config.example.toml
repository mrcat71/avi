# Avi config file (example). The real file lives at
# ~/Library/Application Support/Avi/config.toml and is created automatically on
# first launch. Copy values from here as a starting point; you do not need to
# keep keys you don't change.
#
# Secrets (GitHub/GitLab tokens, AI provider API keys) live in the macOS
# Keychain under service "com.avi" and are never written to this file.

version = 1

[appearance]
theme = "system"           # system | light | dark
density = "comfortable"    # comfortable | compact
fontSize = 13              # 11 to 16; diffs use one point less
diffFont = "SF Mono"       # any installed monospaced family
fileListMode = "tree"      # tree | flat
graphLaneWidth = 16        # 12 | 16 | 20
authorPictures = true      # ask GitHub/GitLab who wrote each commit, then Gravatar

[git]
defaultAuthorName = ""     # used only where Git has no user.name for the repository
defaultAuthorEmail = ""    # used only where Git has no user.email for the repository
signCommits = false        # true signs every commit, as commit.gpgSign does
fetchInterval = 5          # minutes; 0 disables auto-fetch
autoRefresh = true         # false refreshes after Avi's commands and when you return
pruneOnFetch = true        # false fetches with --no-prune
externalEditor = ""        # app or command for Open in Editor; empty picks an installed editor
terminalApp = ""           # app for Open in Terminal; empty uses Terminal

[clone]
defaultDirectory = "~/Developer"
openAfterClone = true
preferredProtocol = "https"     # https | ssh; each clone can switch
rememberDestinationPerProvider = true  # start a clone where the last one from its host went

[ai]
enabled = false
backend = "command"        # command | openai
model = "gpt-6.1-luna"     # any model your backend accepts, e.g. gpt-6.1-sol
temperature = 0.2
maxTokens = 800
conventionalCommits = true # fills ${style} in the prompts
subjectSoftLimit = 50
subjectHardLimit = 72
bodyWrap = 72
commandTemplate = "codex exec --skip-git-repo-check --model ${model} ${effort_kv}"
openAIBaseURL = "https://api.openai.com/v1"
timeoutSeconds = 120

# An executable path replaces the tool Avi finds; empty or not executable is
# ignored. git defaults to /usr/bin/git; codex and claude apply to AI command
# templates that start with that name.
[externalTools]
gitPath = ""
ghPath = ""
glabPath = ""
codexPath = ""
claudePath = ""
diffToolPath = ""          # External Diff runs it with the old and new file; empty uses diff.tool
mergeToolPath = ""
# Empty uses Git's merge.tool; a preset id (for example "vscode" or "goland")
# selects that tool. "custom" runs mergeToolCommand as a shell command.
mergeTool = ""
mergeToolCommand = ""

[advanced]
historyLimit = 200         # commits History loads at first, 50 to 5000
verboseLogging = false     # log every Git command to the system log (Console)

# Pull and merge request titles made from branch names. Every "-" and "_"
# becomes a space except in ticket keys (INFRA-12345), hyphenated file and
# folder names of the repository, and the names below. See
# docs/CONFIGURATION.md#pull-request-titles.
[pullRequests]
ticketPrefixes = []              # e.g. ["INFRA", "OPS"]: infra-123 -> INFRA-123
keepHyphenated = []              # names, "k8s-*-*-ams1" (* is one word), or '/regex/'
learnNamesFromRepository = true
capitalize = false
draft = false                    # start new requests as drafts

# Claude Code, Codex, and other local agents send commit proposals through the
# `avi` command and Avi's control socket. See docs/AGENT-INTEGRATION.md.
[agents]
enabled = true

# `integrations.accounts` is managed by the Accounts UI. Each entry stores
# non-secret metadata (kind, instance URL, username, Keychain reference) -
# the actual token sits in the Keychain.
[integrations]
accounts = []
