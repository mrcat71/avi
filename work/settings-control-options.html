<style>
  #avi-control-options .avi-stage {
    min-height: 244px;
    display: grid;
    place-items: center;
    padding: 24px 12px;
  }
  #avi-control-options .avi-pane {
    --avi-bg: light-dark(#f5f4f3, #222120);
    --avi-group: light-dark(#ffffff, #292827);
    --avi-line: light-dark(#dedddd, #393837);
    --avi-text: light-dark(#242323, #f2f1f0);
    --avi-secondary: light-dark(#686665, #afadab);
    --avi-accent: light-dark(#007aff, #0a84ff);
    width: 100%;
    max-width: 460px;
    padding: 20px;
    border-radius: 14px;
    background: var(--avi-bg);
    color: var(--avi-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    box-sizing: border-box;
  }
  #avi-control-options .avi-title { font-weight: 600; margin: 0 0 10px 12px; }
  #avi-control-options .avi-group {
    border-radius: 12px;
    background: var(--avi-group);
    border: 1px solid var(--avi-line);
    padding: 0 12px;
  }
  #avi-control-options .avi-row {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 68px;
    padding: 12px 0;
    box-sizing: border-box;
  }
  #avi-control-options .avi-row + .avi-row { border-top: 1px solid var(--avi-line); }
  #avi-control-options .avi-label { display: grid; gap: 4px; flex: 1; }
  #avi-control-options .avi-description { color: var(--avi-secondary); font-size: 11px; line-height: 1.4; }
  #avi-control-options .avi-checkbox {
    appearance: none;
    width: 16px;
    height: 16px;
    flex: 0 0 16px;
    border: 1px solid light-dark(#a6a4a2, #797775);
    border-radius: 4px;
    background: light-dark(#fff, #454342);
    margin: 0;
    position: relative;
  }
  #avi-control-options .avi-checkbox:checked { background: var(--avi-accent); border-color: var(--avi-accent); }
  #avi-control-options .avi-checkbox:checked::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 8px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
    left: 5px;
    top: 1px;
  }
  #avi-control-options .avi-switch {
    appearance: none;
    margin: 0;
    width: 30px;
    height: 18px;
    flex: 0 0 30px;
    border: 1px solid light-dark(#c3c1bf, #5c5a58);
    border-radius: 10px;
    background: light-dark(#d7d5d3, #474543);
    position: relative;
  }
  #avi-control-options .avi-switch::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    left: 1px;
    top: 1px;
    box-shadow: 0 1px 2px #0003;
    transition: transform 120ms ease;
  }
  #avi-control-options .avi-switch:checked { background: var(--avi-accent); border-color: var(--avi-accent); }
  #avi-control-options .avi-switch:checked::after { transform: translateX(12px); }
  #avi-control-options input:focus-visible { outline: 3px solid var(--avi-accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    #avi-control-options .avi-switch::after { transition: none; }
  }
  @media (max-width: 400px) {
    #avi-control-options .avi-pane { padding: 14px; }
    #avi-control-options .avi-stage { min-height: 264px; padding: 16px 0; }
  }
</style>
<div id="avi-control-options" class="viz-carousel viz-dotted-background" aria-label="Avi settings control alternatives">
  <section data-variant="Checkboxes" aria-label="Checkbox settings">
    <div class="avi-stage">
      <div class="avi-pane">
        <div class="avi-title">Fetch</div>
        <div class="avi-group">
          <label class="avi-row cursor-interaction">
            <input class="avi-checkbox cursor-interaction" type="checkbox" checked aria-label="Prune on fetch">
            <span class="avi-label"><span>Prune on fetch</span><span class="avi-description">Remove remote-tracking branches that no longer exist.</span></span>
          </label>
          <label class="avi-row cursor-interaction">
            <input class="avi-checkbox cursor-interaction" type="checkbox" aria-label="Auto-refresh">
            <span class="avi-label"><span>Auto-refresh</span><span class="avi-description">Refresh when repository files change.</span></span>
          </label>
        </div>
      </div>
    </div>
  </section>
  <section data-variant="Compact switches" aria-label="Compact switch settings" hidden>
    <div class="avi-stage">
      <div class="avi-pane">
        <div class="avi-title">Fetch</div>
        <div class="avi-group">
          <label class="avi-row cursor-interaction">
            <span class="avi-label"><span>Prune on fetch</span><span class="avi-description">Remove remote-tracking branches that no longer exist.</span></span>
            <input class="avi-switch cursor-interaction" type="checkbox" role="switch" checked aria-label="Prune on fetch">
          </label>
          <label class="avi-row cursor-interaction">
            <span class="avi-label"><span>Auto-refresh</span><span class="avi-description">Refresh when repository files change.</span></span>
            <input class="avi-switch cursor-interaction" type="checkbox" role="switch" aria-label="Auto-refresh">
          </label>
        </div>
      </div>
    </div>
  </section>
</div>
